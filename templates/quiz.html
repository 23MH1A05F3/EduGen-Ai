{% extends "base.html" %}
{% block title %}Quiz Generator - EduGenie AI{% endblock %}
{% block content %}
<div class="page-header">
  <h1>📝 AI Quiz Generator</h1>
  <p>Create quizzes on any topic instantly.</p>
</div>

<div class="form-card">
  <div class="form-row cols-3">
    <input type="text" id="topic" placeholder="Enter a topic (e.g. DevOps, Photosynthesis)">
    <select id="difficulty">
      <option>Easy</option>
      <option>Medium</option>
      <option>Hard</option>
    </select>
    <input type="number" id="count" value="5" min="1" max="20">
  </div>
  <button class="btn btn-primary btn-block" id="generate-btn">🎯 Generate Quiz</button>
</div>

<div class="result-box empty" id="result">Your generated quiz will appear here.</div>
{% endblock %}

{% block scripts %}
<script>
const btn = document.getElementById("generate-btn");
const result = document.getElementById("result");
let currentQuestions = [];

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function renderQuiz(questions) {
  currentQuestions = questions;
  result.classList.remove("empty");
  result.innerHTML = `
    <form id="quiz-form" class="quiz-form">
      ${questions.map((item, index) => `
        <fieldset class="quiz-question">
          <legend>${index + 1}. ${escapeHtml(item.question)}</legend>
          <div class="quiz-options">
            ${Object.entries(item.options).map(([letter, option]) => `
              <label class="quiz-option">
                <input type="radio" name="question-${index}" value="${letter}">
                <span><strong>${letter})</strong> ${escapeHtml(option)}</span>
              </label>
            `).join("")}
          </div>
          <div class="quiz-explanation" id="explanation-${index}" hidden>
            <strong>Correct answer: ${escapeHtml(item.answer)}) ${escapeHtml(item.answer_text)}</strong>
            <p>${escapeHtml(item.explanation)}</p>
          </div>
        </fieldset>
      `).join("")}
      <div class="quiz-actions">
        <button class="btn btn-primary" type="submit">✅ Submit Answers</button>
        <button class="btn btn-accent" type="button" id="explanation-btn" disabled>💡 Show Explanations</button>
      </div>
      <div class="quiz-score" id="quiz-score" hidden></div>
    </form>`;

  const form = document.getElementById("quiz-form");
  const explanationBtn = document.getElementById("explanation-btn");
  const score = document.getElementById("quiz-score");

  form.addEventListener("submit", (event) => {
    event.preventDefault();
    let correct = 0;
    currentQuestions.forEach((item, index) => {
      const selected = form.querySelector(`input[name="question-${index}"]:checked`);
      if (selected && selected.value === item.answer) correct += 1;
    });
    score.textContent = `Your score: ${correct} / ${currentQuestions.length}`;
    score.hidden = false;
    explanationBtn.disabled = false;
  });

  explanationBtn.addEventListener("click", () => {
    currentQuestions.forEach((_, index) => {
      document.getElementById(`explanation-${index}`).hidden = false;
    });
    explanationBtn.disabled = true;
    explanationBtn.textContent = "💡 Explanations Shown";
  });
}

btn.addEventListener("click", async () => {
  const topic = document.getElementById("topic").value.trim();
  const difficulty = document.getElementById("difficulty").value;
  const count = document.getElementById("count").value;
  if (!topic) { alert("Please enter a topic"); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Generating...';
  result.classList.remove("empty");
  result.innerHTML = "Generating your quiz on <strong>" + topic + "</strong>...";

  try {
    const data = await postJSON("/api/quiz", { topic, difficulty, count });
    if (!data.questions || !data.questions.length) {
      result.innerHTML = renderMarkdown(data.quiz);
      return;
    }
    renderQuiz(data.questions);
  } catch (e) {
    result.innerHTML = "⚠️ " + e.message;
  } finally {
    btn.disabled = false;
    btn.innerHTML = "🎯 Generate Quiz";
  }
});
</script>
{% endblock %}
